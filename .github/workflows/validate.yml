name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    name: HACS Validation
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      # HACS validation can only run against PUBLIC repos: the action
      # downloads hacs.json/manifest.json from raw.githubusercontent.com
      # without auth, which 404s while the repo is private. Skip then; the
      # job revives automatically once the repo is public again.
      - name: Check repo visibility
        id: visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "private=$(gh repo view --json isPrivate --jq .isPrivate)" >> "$GITHUB_OUTPUT"

      - name: HACS validation
        if: steps.visibility.outputs.private != 'true'
        uses: "hacs/action@22.5.0"
        with:
          category: "integration"
          ignore: "brands"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    name: Hassfest Validation
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      # hassfest has no usable release tags (only an ancient 1.0.0), so this
      # pins a master SHA instead of floating on @master. Bump manually:
      # https://github.com/home-assistant/actions/commits/master
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb"

  lint:
    runs-on: "ubuntu-latest"
    name: Lint (ruff + mypy)
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Set up uv
        uses: "astral-sh/setup-uv@v10.0.0"
        with:
          enable-cache: true

      # uv reads .python-version (3.14) and installs the interpreter itself;
      # uv.lock is the single source of truth for every tool version.
      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check custom_components tests

      - name: Ruff format check
        run: uv run ruff format --check .

      # Baseline only: errors are reported for the pure planner core
      # ([tool.mypy] in pyproject.toml explains the scope).
      - name: Type check (mypy)
        run: uv run mypy

      - name: Version consistency (manifest == pyproject)
        run: |
          uv run python - <<'PY'
          import json, re, pathlib
          mf = json.loads(pathlib.Path(
              "custom_components/battery_manager/manifest.json").read_text())["version"]
          pp = re.search(r'^version\s*=\s*"([^"]+)"',
                         pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          assert mf == pp, f"version drift: manifest {mf} != pyproject {pp}"
          print("version OK:", mf)
          PY

  tests:
    runs-on: "ubuntu-latest"
    name: Tests (pytest)
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Set up uv
        uses: "astral-sh/setup-uv@v10.0.0"
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      # Core gate: the pure planner core is kept at 100 % coverage — a
      # separate fast step (no HA test helpers) ahead of the full suite.
      - name: Core coverage gate (100 %)
        run: uv run pytest tests/core -p no:homeassistant --cov=custom_components/battery_manager/core --cov-fail-under=100

      # Coverage source comes from [tool.coverage.run] in pyproject.toml;
      # the XML report is kept as a build artifact (no external service).
      # fail_under = 95 in [tool.coverage.report] gates the total coverage.
      - name: Run test suite
        run: uv run pytest tests --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: "actions/upload-artifact@v7"
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  devcontainer:
    runs-on: "ubuntu-latest"
    name: Devcontainer (build + full suite)
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      # Builds .devcontainer/devcontainer.json (incl. postCreateCommand =
      # uv sync) and runs the full check battery INSIDE the container, so a
      # broken devcontainer fails immediately. The lint/tests jobs give
      # faster feedback via setup-uv; this job proves the container itself.
      # No cacheFrom: the devcontainer is image-based (no Dockerfile), the
      # only layers are the pulled base image.
      - name: Build and test in devcontainer
        uses: "devcontainers/ci@v0.3.1900000450"
        with:
          runCmd: >-
            uv run pytest tests/core -p no:homeassistant --cov=custom_components/battery_manager/core --cov-fail-under=100
            && uv run pytest tests -q --cov
            && uv run ruff check custom_components tests
            && uv run ruff format --check .
            && uv run mypy
