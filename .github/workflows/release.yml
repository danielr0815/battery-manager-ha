name: Release validation and preparation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact commit or tag to validate before publishing
        required: true
      tag:
        description: Intended release tag (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.event.release.tag_name }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --no-project python scripts/check_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  quality:
    needs: version
    uses: ./.github/workflows/validate.yml
    with:
      target_ref: ${{ needs.version.outputs.commit }}
